// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

def androidCxxStdlibArgument = "-DCMAKE_CXX_STANDARD_LIBRARIES=-lc++_shared -latomic -lm"

subprojects { subproject ->
  ["com.android.application", "com.android.library"].each { pluginId ->
    subproject.plugins.withId(pluginId) {
      subproject.extensions.configure(com.android.build.gradle.BaseExtension) { androidExt ->
        androidExt.defaultConfig {
          externalNativeBuild {
            cmake {
              arguments androidCxxStdlibArgument
            }
          }
        }
      }
    }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
