name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-and-web:
    name: Repository And Web Checks
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Check repository guards
        run: |
          pnpm check:conflicts
          pnpm check:release-version
          pnpm exec prettier --check ".github/**/*.{yml,yaml,md}" "scripts/**/*.mjs" "src/**/*.{ts,tsx,css}" "packages/**/*.{ts,tsx,json}" "mobile-app/app/**/*.{ts,tsx}" "mobile-app/src/**/*.{ts,tsx}" "*.{md,json}"

      - name: Build web app
        run: pnpm build

  mobile:
    name: Mobile Checks
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Typecheck mobile app
        run: pnpm --dir mobile-app typecheck

      - name: Test mobile chat composer
        run: pnpm --dir mobile-app test:chat-composer

  tauri-backend:
    name: Tauri Backend Checks
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      OLLAMA_VERSION: v0.17.7

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: |
            src-tauri -> target
          cache-on-failure: true

      - name: Cache Ollama sidecar
        id: cache-ollama-sidecar
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: src-tauri/binaries/ollama-x86_64-pc-windows-msvc.exe
          key: ollama-sidecar-windows-amd64-${{ env.OLLAMA_VERSION }}

      - name: Download Ollama sidecar
        if: steps.cache-ollama-sidecar.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $binDir = "src-tauri\binaries"
          $archivePath = Join-Path $env:RUNNER_TEMP "ollama-windows-amd64.zip"
          $extractDir = Join-Path $env:RUNNER_TEMP "ollama-extract"
          $downloadUrl = "https://github.com/ollama/ollama/releases/download/$env:OLLAMA_VERSION/ollama-windows-amd64.zip"
          New-Item -ItemType Directory -Force -Path $binDir | Out-Null
          Remove-Item $archivePath -Force -ErrorAction SilentlyContinue
          Remove-Item $extractDir -Recurse -Force -ErrorAction SilentlyContinue
          Invoke-WebRequest -Uri $downloadUrl -OutFile $archivePath
          Expand-Archive -Path $archivePath -DestinationPath $extractDir -Force
          $sourceExe = Get-ChildItem -Path $extractDir -Recurse -Filter "ollama.exe" | Select-Object -First 1 -ExpandProperty FullName
          if (-not $sourceExe) {
            throw "ollama.exe not found in downloaded archive."
          }
          Copy-Item $sourceExe "src-tauri\binaries\ollama-x86_64-pc-windows-msvc.exe" -Force

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Test Rust library
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
