name: Release Desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要构建或重试的已有发布标签，例如 v1.1.12"
        required: true
        default: "v1.1.12"

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  prepare-release:
    name: Prepare Draft Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Validate release version
        run: node scripts/check-release-version.mjs --tag "${RELEASE_TAG}"

      - name: Ensure draft release exists
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          $ErrorActionPreference = 'Continue'
          $notes = "ResearchAssistant $env:RELEASE_TAG 比赛演示构建。请核对 Windows 安装包、Android demo 签名和 SHA-256 后再发布。"
          for ($attempt = 1; $attempt -le 6; $attempt++) {
            & gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json url 2>$null
            if ($LASTEXITCODE -eq 0) {
              Write-Output "Release $env:RELEASE_TAG 已存在，将复用现有条目。"
              return
            }

            & gh release create $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --draft --title "ResearchAssistant $env:RELEASE_TAG" --notes $notes
            if ($LASTEXITCODE -eq 0) {
              Write-Output "已创建 draft release $env:RELEASE_TAG。"
              return
            }

            if ($attempt -lt 6) {
              $delay = [Math]::Min(60, 5 * [Math]::Pow(2, $attempt - 1))
              Write-Warning "GitHub Release API 暂时不可用，第 $attempt 次失败，$delay 秒后重试。"
              Start-Sleep -Seconds $delay
            }
          }
          throw "连续 6 次无法读取或创建 Release $env:RELEASE_TAG。"

  windows-tauri-release:
    name: Build And Release Windows Desktop
    runs-on: windows-latest
    needs: prepare-release
    env:
      OLLAMA_VERSION: v0.17.7

    steps:
      - name: Checkout release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Validate release version
        run: node scripts/check-release-version.mjs --tag "${{ env.RELEASE_TAG }}"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: |
            src-tauri -> target
          cache-on-failure: true

      - name: Cache Ollama sidecar
        id: cache-ollama-sidecar
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: src-tauri/binaries/ollama-x86_64-pc-windows-msvc.exe
          key: ollama-sidecar-windows-amd64-${{ env.OLLAMA_VERSION }}

      - name: Download Ollama sidecar
        if: steps.cache-ollama-sidecar.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $binDir = "src-tauri\binaries"
          $archivePath = Join-Path $env:RUNNER_TEMP "ollama-windows-amd64.zip"
          $extractDir = Join-Path $env:RUNNER_TEMP "ollama-extract"
          $downloadUrl = "https://github.com/ollama/ollama/releases/download/$env:OLLAMA_VERSION/ollama-windows-amd64.zip"
          New-Item -ItemType Directory -Force -Path $binDir | Out-Null
          Remove-Item $archivePath -Force -ErrorAction SilentlyContinue
          Remove-Item $extractDir -Recurse -Force -ErrorAction SilentlyContinue
          Invoke-WebRequest -Uri $downloadUrl -OutFile $archivePath
          Expand-Archive -Path $archivePath -DestinationPath $extractDir -Force
          $sourceExe = Get-ChildItem -Path $extractDir -Recurse -Filter "ollama.exe" | Select-Object -First 1 -ExpandProperty FullName
          if (-not $sourceExe) {
            throw "ollama.exe not found in downloaded archive."
          }
          Copy-Item $sourceExe "src-tauri\binaries\ollama-x86_64-pc-windows-msvc.exe" -Force

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build Tauri release
        run: pnpm tauri build --bundles nsis --ci

      - name: Upload Windows assets with retry
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem "src-tauri\target\release\bundle\nsis" -File | Where-Object { $_.Extension -eq ".exe" })
          if ($files.Count -eq 0) {
            throw "未找到 Windows NSIS 安装包。"
          }

          $checksumLines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $checksumLines | Set-Content -Encoding utf8 "SHA256SUMS-windows.txt"

          $assets = @($files | ForEach-Object { $_.FullName })
          $assets += (Resolve-Path "SHA256SUMS-windows.txt").Path
          $arguments = @("release", "upload", $env:RELEASE_TAG) + $assets + @("--repo", $env:GITHUB_REPOSITORY, "--clobber")
          $ErrorActionPreference = 'Continue'
          for ($attempt = 1; $attempt -le 6; $attempt++) {
            & gh @arguments
            if ($LASTEXITCODE -eq 0) {
              return
            }
            if ($attempt -lt 6) {
              $delay = [Math]::Min(60, 5 * [Math]::Pow(2, $attempt - 1))
              Write-Warning "Windows 产物上传第 $attempt 次失败，$delay 秒后重试。"
              Start-Sleep -Seconds $delay
            }
          }
          throw "连续 6 次无法上传 Windows 产物。"

  android-apk-release:
    name: Build And Release Android APK
    runs-on: windows-latest
    needs: prepare-release

    steps:
      - name: Checkout release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Validate release version
        run: node scripts/check-release-version.mjs --tag "${{ env.RELEASE_TAG }}"

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Generate Android autolink snapshot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pnpm --dir mobile-app exec expo-modules-autolinking react-native-config --json --platform android --project-root "." "node_modules" | Set-Content -Encoding utf8 "mobile-app/android/autolink-node-modules.json"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Configure demo signing
        working-directory: mobile-app/android/app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path "debug.keystore")) {
            keytool -genkeypair -v -storetype JKS -keystore "debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          }

      - name: Build Android release APK
        working-directory: mobile-app/android
        run: .\gradlew.bat assembleRelease --console=plain --no-daemon

      - name: Upload Android assets with retry
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $source = "mobile-app\android\app\build\outputs\apk\release\app-release.apk"
          if (-not (Test-Path $source)) {
            throw "未找到 Android release APK。"
          }

          $asset = "mobile-app\android\app\build\outputs\apk\release\researchassistant-mobile-$($env:RELEASE_TAG)-demo.apk"
          Copy-Item -LiteralPath $source -Destination $asset -Force
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $asset).Hash.ToLowerInvariant()
          "$hash  $([IO.Path]::GetFileName($asset))" | Set-Content -Encoding utf8 "SHA256SUMS-android.txt"

          $assets = @((Resolve-Path $asset).Path, (Resolve-Path "SHA256SUMS-android.txt").Path)
          $arguments = @("release", "upload", $env:RELEASE_TAG) + $assets + @("--repo", $env:GITHUB_REPOSITORY, "--clobber")
          $ErrorActionPreference = 'Continue'
          for ($attempt = 1; $attempt -le 6; $attempt++) {
            & gh @arguments
            if ($LASTEXITCODE -eq 0) {
              return
            }
            if ($attempt -lt 6) {
              $delay = [Math]::Min(60, 5 * [Math]::Pow(2, $attempt - 1))
              Write-Warning "Android 产物上传第 $attempt 次失败，$delay 秒后重试。"
              Start-Sleep -Seconds $delay
            }
          }
          throw "连续 6 次无法上传 Android 产物。"
