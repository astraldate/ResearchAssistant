name: Release Android

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "要重新构建并上传 APK 的已有发布标签，例如 v1.1.12"
        required: true
        default: "v1.1.12"

permissions:
  contents: write

concurrency:
  group: release-android-${{ inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  android-apk-release:
    name: Build And Upload Android APK
    runs-on: windows-latest

    steps:
      - name: Checkout requested tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Validate release version
        run: node scripts/check-release-version.mjs --tag "${{ env.RELEASE_TAG }}"

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Generate Android autolink snapshot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pnpm --dir mobile-app exec expo-modules-autolinking react-native-config --json --platform android --project-root "." "node_modules" | Set-Content -Encoding utf8 "mobile-app/android/autolink-node-modules.json"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Configure demo signing
        working-directory: mobile-app/android/app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path "debug.keystore")) {
            keytool -genkeypair -v -storetype JKS -keystore "debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          }

      - name: Build Android release APK
        working-directory: mobile-app/android
        run: .\gradlew.bat assembleRelease --console=plain --no-daemon

      - name: Upload Android assets with retry
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $source = "mobile-app\android\app\build\outputs\apk\release\app-release.apk"
          if (-not (Test-Path $source)) {
            throw "未找到 Android release APK。"
          }

          $asset = "mobile-app\android\app\build\outputs\apk\release\researchassistant-mobile-$($env:RELEASE_TAG)-demo.apk"
          Copy-Item -LiteralPath $source -Destination $asset -Force
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $asset).Hash.ToLowerInvariant()
          "$hash  $([IO.Path]::GetFileName($asset))" | Set-Content -Encoding utf8 "SHA256SUMS-android.txt"

          $assets = @((Resolve-Path $asset).Path, (Resolve-Path "SHA256SUMS-android.txt").Path)
          $arguments = @("release", "upload", $env:RELEASE_TAG) + $assets + @("--repo", $env:GITHUB_REPOSITORY, "--clobber")
          $ErrorActionPreference = 'Continue'
          for ($attempt = 1; $attempt -le 6; $attempt++) {
            & gh @arguments
            if ($LASTEXITCODE -eq 0) {
              return
            }
            if ($attempt -lt 6) {
              $delay = [Math]::Min(60, 5 * [Math]::Pow(2, $attempt - 1))
              Write-Warning "Android 产物上传第 $attempt 次失败，$delay 秒后重试。"
              Start-Sleep -Seconds $delay
            }
          }
          throw "连续 6 次无法上传 Android 产物。"
